NEURON_NET:
    BATCH_SIZE: 128
    MEMORY_SIZE: 300000
    BUFFER_MIN_SIZE: [256, 256]
    ANNEALING_LENGTH: 2000
    NUMOF_TEST_EP: 10
    NUMOF_TRAIN_EP: 6000
    NUMOF_TF_EP: 10
    TIME_SLOT_PER_TIMEFRAME: 10
    SLOT_DURATION: 0.4

    NUM_LOWER_AGENTS: 20
    OMEGA_Q1: 1000.0
    OMEGA_Q2: 0.12
    OMEGA_Q3: 5

    HIDDEN_MF: 50
    HIDDEN_Q1: 256
    HIDDEN_Q2: 128

    UPPER_LR: 1e-4
    LOWER_LR: 1e-4
    MF_LR: 1e-4
    AGENT_HIDDEN_LAYER: [128, 64]
    MF_HIDDEN_LAYER: [50, 50]
    MF_SAC_HIDDEN_LAYER: [128, 128]
    DISCOUNT_FACTOR: 0.95
    UPDATE_TARGET_COEF: 0.005 # 0.005
    ZETA: 1.0
    ZETA_MAX: 20          # Cap for upper-level zeta
    ZETA_STEP: 1.001      # Upper zeta additive step per training step (0.001 after conversion)

    # Lower-level agent zeta schedule (episode-based, separate from upper)
    ZETA_LOWER_WARMUP: 200   # Episodes to keep zeta_lower = ZETA (full exploration)
    ZETA_LOWER_STEP: 0.005   # Additive increment per episode after warmup ends
    ZETA_LOWER_MAX: 5.0      # Cap for lower-level zeta (keep lower than upper cap)

    EPSILON: 0.05 # 0.01
    EPSILON_DECAY: 0.995

    LOWER_STABLE: 100000

